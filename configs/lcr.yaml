# LCR (LCRRothopPP) recipe. Partial TrainingConfig: listed fields override
# dataclass defaults, everything else keeps its default / prior CLI value.
name: lcr
domain: restaurant

epochs: 15
gce_q: 0.4
lcr_batch_size: 32
lcr_learning_rate: 1.0e-5
lcr_bert_lr: 1.0e-5
lcr_hidden_units: 768
lcr_hop: 6
lcr_drop_1: 0.5
lcr_drop_2: 0.3
lcr_l1: 1.0e-7
lcr_l2: 1.0e-7
seed: 0
validation_data_size: 100
