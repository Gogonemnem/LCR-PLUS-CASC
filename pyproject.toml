[project]
name = "lcr-plus-casc"
version = "0.1.0"
description = "CASC (BERT) and LCR (RoTHop++) aspect category / polarity extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "numpy",
    "pandas",
    "scikit-learn",
    "tqdm",
    "spacy",
    "optuna",
]

[project.optional-dependencies]
tf = [
    "tensorflow",
    "tensorflow-addons",
    "keras-tuner",
]

[project.scripts]
lcr = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lcr_plus_casc*"]
